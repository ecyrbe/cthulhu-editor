<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arkham Registry</title>
    <meta
      name="description"
      content="Create and manage investigator sheets online with Arkham Registry. Fully digital, printable, and multi-language support for your next horror RPG."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://arkham-registry.online/" />
    <meta property="og:title" content="Arkham Registry" />
    <meta
      property="og:description"
      content="Create and manage investigator sheets online with Arkham Registry. Fully digital, printable, and multi-language support for your next horror RPG."
    />
    <meta
      property="og:image"
      content="https://arkham-registry.online/og-image.png"
    />
    <meta
      property="og:image:alt"
      content="Call of Cthulhu 7th Edition Investigator Sheet digital interface"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://arkham-registry.online/" />
    <meta
      property="twitter:title"
      content="Call of Cthulhu Investigator Sheet: Digital & Printable"
    />
    <meta
      property="twitter:description"
      content="Create and manage investigator sheets online with Arkham Registry. Fully digital, printable, and multi-language support for your next horror RPG."
    />
    <meta
      property="twitter:image"
      content="https://arkham-registry.online/og-image.png"
    />
  </head>
  <!-- Website content -->
  <body>
    <div id="root">
      <style>
        body {
          margin: 0;
          background: #0c0c0c;
        }
        .initial-loader {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background-color: #0c0c0c;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          z-index: 9999;
          font-family: serif;
        }
        .initial-logo {
          display: flex;
          flex-direction: column;
          line-height: 1;
          margin-bottom: 2rem;
          text-align: center;
        }
        .initial-logo-top {
          font-size: 1rem;
          letter-spacing: 4px;
          text-transform: uppercase;
          color: #8b0000;
        }
        .initial-logo-bottom {
          font-size: 2.5rem;
          font-weight: bold;
          color: #fff;
          letter-spacing: 2px;
        }
        .scale-up {
          animation: scaleBreath 3s ease-in-out infinite;
        }
        @keyframes scaleBreath {
          0%,
          100% {
            transform: scale(1);
            opacity: 0.8;
          }
          50% {
            transform: scale(1.05);
            opacity: 1;
          }
        }
        .initial-loading-bar {
          width: 200px;
          height: 2px;
          background: #222;
          border-radius: 2px;
          overflow: hidden;
        }
        .initial-loading-progress {
          width: 100%;
          height: 100%;
          background: #8b0000;
          animation: loadingAnim 2s ease-in-out infinite;
          transform-origin: left;
        }
        @keyframes loadingAnim {
          0% {
            transform: scaleX(0);
          }
          50% {
            transform: scaleX(1);
          }
          100% {
            transform: scaleX(0);
            transform-origin: right;
          }
        }
      </style>
      <div class="initial-loader">
        <div class="initial-logo scale-up">
          <span class="initial-logo-top">Call of</span>
          <span class="initial-logo-bottom">Cthulhu</span>
        </div>
        <div class="initial-loading-bar">
          <div class="initial-loading-progress"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
